name: metric_hours
description: Registro de actividades y gestion de tiempo personal con proyectos.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cross_file: ^0.3.5+5
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  speech_to_text: ^7.4.0
  fl_chart: ^1.2.0
  http: ^1.2.2
  sqflite: ^2.4.4
  path: ^1.9.1
  excel: ^4.0.6
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.3.1
  mailer: ^7.2.0
  workmanager: ^0.10.10
  flutter_secure_storage: ^11.2.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/Logo_app.png
